<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DRT 위치 전송</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
  button { font-size: 16px; padding: 10px 16px; }
  input, select { font-size: 15px; padding: 6px; }
  pre { background: #f4f4f5; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
  .row { margin: 12px 0; }
</style>
</head>
<body>
  <h1>DRT 도착지 추출</h1>
  <p>브라우저 위치 권한을 허용하면 현재 위치를 서버로 보내고, 검색어로 목적지 계획을 받아옵니다.</p>

  <div class="row">
    <label>검색어 <input id="query" value="정형외과" /></label>
    <label><input type="checkbox" id="isSpecific" /> 정확한 장소명</label>
  </div>
  <div class="row">
    <label>최대 도보(m) <input id="maxWalk" type="number" min="1" max="2000" value="500" /></label>
    <label>예상 대기(초) <input id="expectedWait" type="number" min="0" max="7200" value="300" /></label>
  </div>
  <div class="row">
    <label>릴레이 토큰(선택) <input id="relayToken" type="password" autocomplete="off" /></label>
  </div>
  <div class="row">
    <button id="btn">현재 위치로 목적지 찾기</button>
  </div>
  <pre id="out">대기 중…</pre>

<script>
// 같은 도메인에 배포되면 API_BASE는 빈 문자열로 두면 됩니다.
const API_BASE = "";

function headers() {
  const relayToken = document.getElementById("relayToken").value.trim();
  const h = { "Content-Type": "application/json" };
  if (relayToken) h["X-Relay-Token"] = relayToken;
  return h;
}

// 손으로 좌표를 복사·붙여넣지 않도록, 실시간 GPS 좌표를 콜백으로 넘겨준다.
function getCurrentCoords(onSuccess, onError) {
  if (!navigator.geolocation) { onError({ message: "이 브라우저는 위치를 지원하지 않습니다." }); return; }
  navigator.geolocation.getCurrentPosition(onSuccess, onError, { enableHighAccuracy: true });
}

// GPS를 한 번만 읽어서, 서버 API 흐름(위치 → 정류장 → 계획) 순서 그대로 하나의
// 버튼에 이어 붙인다:
// 1) POST /api/location에 저장 2) GET /api/location으로 재조회해 왕복 확인
// 3) POST /api/stations/departure로 승차 정류장을 확인 4) POST /api/plan으로
//    목적지 계획(도보 vs DRT)까지 받아온다.
// Swagger에서 임의 좌표를 손으로 입력하던 것과 달리, 이 좌표는 항상 지금
// 이 기기의 실제 GPS 값이다.
async function run() {
  const out = document.getElementById("out");
  out.textContent = "위치 확인 중…";
  getCurrentCoords(async (pos) => {
    const sent = {
      latitude: pos.coords.latitude,
      longitude: pos.coords.longitude,
      accuracy: pos.coords.accuracy,
      captured_at: new Date().toISOString(),
    };
    const maxWalkM = Number(document.getElementById("maxWalk").value);
    try {
      out.textContent = "POST /api/location 전송 중…";
      const postRes = await fetch(API_BASE + "/api/location", {
        method: "POST", headers: headers(), body: JSON.stringify(sent),
      });
      const posted = await postRes.json();

      const getRes = await fetch(API_BASE + "/api/location", { headers: headers() });
      const latest = await getRes.json();

      out.textContent = "POST /api/stations/departure 전송 중…";
      const departureRes = await fetch(API_BASE + "/api/stations/departure", {
        method: "POST", headers: headers(),
        body: JSON.stringify({ ...sent, max_walk_m: maxWalkM }),
      });
      const departure = await departureRes.json();

      out.textContent = "POST /api/plan 전송 중…";
      const planRes = await fetch(API_BASE + "/api/plan", {
        method: "POST", headers: headers(),
        body: JSON.stringify({
          ...sent,
          query: document.getElementById("query").value,
          is_specific: document.getElementById("isSpecific").checked,
          max_walk_m: maxWalkM,
          expected_wait_s: Number(document.getElementById("expectedWait").value),
        }),
      });
      const plan = await planRes.json();

      out.textContent = JSON.stringify({ sent, posted, latest, departure, plan }, null, 2);
    } catch (e) {
      out.textContent = "요청 실패: " + e;
    }
  }, (err) => { out.textContent = "위치 오류: " + err.message; });
}

document.getElementById("btn").addEventListener("click", run);
</script>
</body>
</html>
