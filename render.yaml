# Render 블루프린트 — 4개 서비스를 한 번에 정의한다.
#
# 사용법: Render 대시보드에서 "New +" → "Blueprint" → 이 저장소 연결.
# `sync: false`인 값은 Render가 자동으로 채우지 않는다 — 대시보드에서 서비스별로
# 직접 입력해야 한다(비밀값이거나, 배포 후에만 정해지는 값). 자세한 설명과 값
# 채우는 순서는 docs/cloud_deployment.md를 보세요.
#
# 서비스 이름(name)이 보통 공개 URL(https://<name>.onrender.com)을 그대로 결정하지만,
# 그 이름을 Render 전역에서 이미 다른 계정이 쓰고 있으면 임의 접미사가 붙은 실제
# 주소가 배정된다(실제로 main-server → main-server-ecm1, mcp-server → mcp-server-iyjw,
# mock-drt-server → mock-drt-server-4yf1로 배정된 사례가 있었다). **배포 후 각 서비스
# 페이지 상단의 실제 URL을 확인해서, 아래 env var들의 고정값이 실제와 다르면 대시보드에서
# 직접 고쳐야 한다.** (2026-08-12: mock-drt-server의 접미사를 놓쳐서 예약 문자에 실리는
# 조회 링크가 죽어 있던 사례가 실제로 있었다 — TRACKING_BASE_URL/DRT_SERVER_BASE_URL/
# DISPATCH_BASE_URL 세 곳 모두 확인할 것.)

services:
  # ── ③ 배차 서버 ──────────────────────────────────────────────────────────
  - type: web
    name: mock-drt-server
    runtime: docker
    plan: free
    dockerfilePath: ./mock_drt_server/Dockerfile
    dockerContext: ./mock_drt_server
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./mock_drt.db
      - key: VEHICLE_COUNT
        value: "2"
      - key: VEHICLE_SPEED_KMH
        value: "30"
      - key: BACKGROUND_UPDATE_INTERVAL_SECONDS
        value: "1"
      - key: ARRIVAL_WAIT_SECONDS
        value: "2"
      - key: TRACKING_TOKEN_TTL_HOURS
        value: "24"
      - key: TMAP_API_URL
        value: https://apis.openapi.sk.com/tmap/routes
      - key: TMAP_TIMEOUT_SECONDS
        value: "4"
      # 비밀값 / 배포 후 결정: Render 대시보드에서 직접 입력
      - key: TMAP_APP_KEY
        sync: false
      # 조회 링크 기본 주소. 이 서비스 자신의 Render 주소로 두거나(기본),
      # 기존 GitHub Pages 조회 화면(kt-26-team7.github.io/drt-tracking)을
      # 계속 쓸지 결정 필요 — docs/cloud_deployment.md 참고.
      # 2026-08-12 실측: mock-drt-server라는 이름이 이미 다른 계정에 쓰이고 있어
      # 실제로는 mock-drt-server-4yf1로 배정됐다(파일 상단 주석 참고). 이 값이
      # 실제 배정 주소와 다르면 예약 문자에 실리는 조회 링크가 그대로 죽는다
      # (실제로 이 문제로 문자 링크가 열리지 않던 것을 확인·수정함).
      - key: TRACKING_BASE_URL
        value: https://mock-drt-server-4yf1.onrender.com/tracking

  # ── ② drt_service ────────────────────────────────────────────────────────
  - type: web
    name: drt-service
    runtime: docker
    plan: free
    dockerfilePath: ./drt_service/Dockerfile
    dockerContext: ./drt_service
    healthCheckPath: /health
    envVars:
      # DEBUG를 비워 두면 기본 False — RELAY_API_TOKEN 검증이 살아 있어야 한다.
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
      # 2026-08-12 실측: 실제 배정 주소는 mock-drt-server-4yf1(파일 상단 주석 참고).
      - key: DRT_SERVER_BASE_URL
        value: https://mock-drt-server-4yf1.onrender.com
      # 비밀값: main-server의 RELAY_API_TOKEN과 반드시 같은 값으로 직접 입력
      # (생성: python -c "import secrets;print(secrets.token_urlsafe(32))")
      - key: RELAY_API_TOKEN
        sync: false
      - key: TMAP_APP_KEY
        sync: false

  # ── ⓪ 메인 서버 ──────────────────────────────────────────────────────────
  - type: web
    name: main-server
    runtime: docker
    plan: free   # 콜드 스타트가 문제되면 starter로 올리세요 — docs/cloud_deployment.md §4
    dockerfilePath: ./main_server/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DRT_BASE_URL
        value: https://drt-service.onrender.com
      # 2026-08-12 실측: 실제 배정 주소는 mock-drt-server-4yf1(파일 상단 주석 참고).
      - key: DISPATCH_BASE_URL
        value: https://mock-drt-server-4yf1.onrender.com
      # drt-service와 동일한 값으로 직접 입력
      - key: RELAY_API_TOKEN
        sync: false
      # 2026-08-11 carecall_drt 이식 이후 신규 — carecall_drt가 drt_service를 직접
      # 호출할 때 쓰는 이름(위 DRT_BASE_URL/RELAY_API_TOKEN과 각각 같은 값이어야
      # 한다. docs/04_carecall_drt_이식.md 참고).
      - key: DRT_BACKEND_URL
        value: https://drt-service.onrender.com
      - key: DRT_RELAY_TOKEN
        sync: false
      - key: DRT_BACKEND_ENABLED
        value: "true"
      # 신규 — mcp-server가 X-Call-Token으로 보낼 값. mcp-server와 동일한 값으로 직접 입력
      - key: MAIN_SERVER_TOKEN
        sync: false
      - key: GEMINI_KEY
        sync: false
      # 2026-08-12 신규 — 실제 문자 발송(ClawOps 메시지 API). 셋 다 있어야
      # ClawOpsSmsSender를 쓴다. 하나라도 비면 RecordingSmsSender(기록만)로
      # 자동 폴백하므로 당장 안 채워도 서버는 정상 동작한다.
      - key: CLAWOPS_API_KEY
        sync: false
      - key: CLAWOPS_ACCOUNT_ID
        sync: false
      # 전화 연동에 쓰는 것과 같은, ClawOps 계정에 사전 등록된 발신 번호.
      - key: CLAWOPS_FROM_NUMBER
        sync: false

  # ── [신규] MCP 도구 서버 ─────────────────────────────────────────────────
  - type: web
    name: mcp-server
    runtime: docker
    plan: free   # 콜드 스타트가 문제되면 starter로 올리세요 — docs/cloud_deployment.md §4
    dockerfilePath: ./mcp_server/Dockerfile
    dockerContext: ./mcp_server
    healthCheckPath: /healthz
    envVars:
      # 실제 배정 주소가 다를 수 있음(파일 상단 주석 참고) — 이 저장소 배포본은
      # 실제로 main-server-ecm1.onrender.com으로 배정됐다.
      - key: MAIN_SERVER_BASE_URL
        value: https://main-server-ecm1.onrender.com
      # main-server와 동일한 값으로 직접 입력
      - key: MAIN_SERVER_TOKEN
        sync: false
      # Render 무료 플랜 콜드 스타트(최대 ~1분)를 견디도록 여유 있게 잡는다.
      # main-server를 Starter(상시 구동)로 올리면 낮춰도 된다.
      - key: MAIN_SERVER_TIMEOUT_S
        value: "60"
